name: Deploy GitHub Pages preview

on:
  push:
    branches: [main, feat/gorgon-company-website-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: true
  VITE_BASE: '/wy/'
  VITE_SITE_URL: 'https://cvcingcvc-code.github.io'

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Install Playwright Chromium for OG rendering
        run: npx playwright install --with-deps chromium

      - name: Generate social preview image
        run: npm run og

      - name: Build for GitHub Pages
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
