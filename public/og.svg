<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#070C17"/>
      <stop offset="1" stop-color="#081426"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#57E6D9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#57E6D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#E8F1FF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F1FF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#E8F1FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="300" r="400" fill="url(#glowA)"/>
  <circle cx="210" cy="610" r="330" fill="url(#glowB)"/>
  <rect x="0" y="0" width="1200" height="220" fill="url(#fade)"/>

  <!-- brand lockup -->
  <g transform="translate(80 68)">
