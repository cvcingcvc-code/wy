  <text x="162" y="98" fill="#F2F6FD" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="6">GORGON</text>
  <text x="162" y="121" fill="#A9B8CE" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4.4">TECHNOLOGY</text>

  <text x="80" y="340" fill="#F2F6FD" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="600" letter-spacing="-2.6">BUILDING AI FOR</text>
  <text x="80" y="424" fill="#6EA8FF" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="600" letter-spacing="-2.6">REAL-WORLD WORK.</text>

  <line x1="80" y1="476" x2="560" y2="476" stroke="#E8F1FF" stroke-opacity="0.16"/>
  <text x="80" y="518" fill="#A9B8CE" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.4">AI APPLICATIONS · AGENTS · AUTOMATION · LOCAL MODELS</text>
  <text x="80" y="572" fill="#6E7F97" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2">GORGON TECHNOLOGY · V1 / 2026</text>

  <!-- system diagram -->
  <g transform="translate(928 292)" fill="none">
